<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="SashaBarrera">
    <title>TACO PALACE</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <header>
        <nav class="nav">
            <div class="Barra-nav">
                <img src="static/images/logo.png" alt="logo">
                <h1><span class="Nombre-Tienda">Taco</span>Palace</h1>
            </div>
            <div class="busqueda-nav">
                <input type="text" id="email" name="email" placeholder="Correo o usuario">
                <button class="barra-boton">Login</button>
                <div class="carrito">
                    <img src="static/images/carrito.png" alt="Carrito">
                    <span>0</span>
                </div>
            </div>
        </nav>
    </header>

    <main class="main">
        <section class="seccion-superior">
            <div class="contenido-main">
                <img src="static/images/enchiladas.jpg" alt="Enchiladas">
                <p>Enchiladas</p>
            </div>

            <div class="contenido-main">
                <img src="static/images/tacos.jpg" alt="Tacos">
                <p>Tacos</p>
            </div>

            <div class="contenido-main">
                <img src="static/images/flautas.jpg" alt="Flautas">
                <p>Flautas</p>
            </div>

            <div class="contenido-main">
                <img src="static/images/gorditas.jpg" alt="Gorditas">
                <p>Gorditas</p>
            </div>

            <div class="contenido-main">
                <img src="static/images/tostadas.jpg" alt="Tostadas">
                <p>Tostadas</p>
            </div>

            <div class="contenido-main">
                <img src="static/images/enfrijoladas.jpg" alt="Enfrijoladas">
                <p>Enfrijoladas</p>
            </div>
        </section>

        <section class="seccion-izquierda">
            <div class="descripcion-izquierdo">
                <div>
                    <h3 class="texto">La mejor variedad en platillos de comida <span>mexicana</span></h3>
                    <p class="texto">Contamos con <a href="#">servicio</a> a <span>domicilio</span></p>
                </div>
                <img src="static/images/comida-mexicana.jpg" alt="Servicio a domicilio">
            </div>
        </section>

        <section class="seccion-derecha">
            <h3>Recomendados:</h3>

            <div class="contenido-derecho">
                <img src="static/images/orden-tacos.jpg" alt="Orden de Tacos">
                <p>Orden de Tacos <a href="#">Ver más...</a></p>
                <div>
                    <button class="derecho-boton">+</button>
                </div>
            </div>

            <div class="contenido-derecho">
                <img src="static/images/orden-flautas.jpg" alt="Orden de Flautas">
                <p>Orden de Flautas <a href="#">Ver más...</a></p>
                <div>
                    <button class="derecho-boton">+</button>
                </div>
            </div>
        </section>
    </main>

    <script src="static/js/script.js"></script>
</body>

</html>
